
# Basic settings
name: experiment_dinov3_ssl_b200_hrft
output-dir: /${oc.env:CHECKPOINT}/${oc.env:JOB_ID}
seed: 0

# CLI args from get_args_parser
config-file: /home/obed/medproj/dinov3/dinov3/configs/microus_ssl_config_hrft.yaml
no-resume: true
eval-only: false
eval: ""
eval_pretrained_weights: ""
benchmark-codebase: false
test-ibot: false
profiling: false
dump-fsdp-weights: false
record_ref_losses: false
ref_losses_path: ""
multi-distillation: false
opts: []

MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: ''
  DTYPE: float32
compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP
dino:
  loss_weight: 1.0
  global_ignore_diagonal: true
  head_n_prototypes: 4096
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
  koleo_loss_distributed: true
  koleo_topk: 1
  koleo_distributed_replicas: 0
  koleo_distributed_loss_group_size: 128
  force_weight_norm: false
  reweight_dino_local_loss: true
  local_loss_weight_schedule:
    start: 0.5
    peak: 0.5
    end: 0.5
    warmup_epochs: 0
    cosine_epochs: 0
  koleo_distributed_loss_group_data: true
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: false
  separate_head: true
  head_n_prototypes: 4096
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
gram:
  use_loss: true
  compute_stats: false
  ckpt: '/data/project/users/obed/checkpoint_store/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth'
  loss_weight: 1.0
  ema_teacher: false
  it_load_ema_teacher: -1
  rep_update: false
  update_frequency: 10000
  it_first_update: 1010000
  max_updates: 3
  normalized: true
  img_level: true
  remove_neg: false
  remove_only_teacher_neg: false
  tokens_used: all
  global_teacher_resize_method: bicubic
  global_teacher_resize_antialias: false
  loss_weight_schedule:
    start: 1.5
    peak: 1.5
    end: 1.5
    warmup_epochs: 0
    cosine_epochs: 0
train:
  batch_size_per_gpu: 128
  dataset_path: /data/project/users/mahdi/unlabelled_microus_png
  output_dir: ${output-dir}
  saveckp_freq: 20
  seed: 0
  num_workers: 16
  OFFICIAL_EPOCH_LENGTH: 1000
  monitor_gradient_norm: false
  chunk_schedule: []
  cache_dataset: true
  use_teacher_head: true
  learn_from_teacher_tokens: false
  centering: sinkhorn_knopp
  checkpointing: true
  checkpointing_full: true
  compile: false
  cudagraphs: false
  cell_augmentation: false
  cell_augmentation_type: hpa
  sharded_eval_checkpoint: true
student:
  arch: vit_large
  patch_size: 16
  drop_path_rate: 0.3
  layerscale: 1.0e-05
  patch_drop: 0.0
  pretrained_weights: ''
  ffn_layer: mlp
  ffn_ratio: 4.0
  resume_from_teacher_chkpt: '/data/project/users/obed/checkpoint_store/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth'
  qkv_bias: false
  proj_bias: true
  ffn_bias: true
  norm_layer: layernormbf16
  n_storage_tokens: 4
  untie_cls_and_patch_norms: false
  untie_global_and_local_cls_norm: true
  mask_k_bias: true
  in_chans: 3
  pos_embed_type: rope
  pos_embed_rope_base: 100
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: separate
  pos_embed_rope_shift_coords: null
  pos_embed_rope_jitter_coords: null
  pos_embed_rope_rescale_coords: 2
  pos_embed_rope_dtype: fp32
  fp8_enabled: true
  fp8_filter: blocks
teacher:
  # momentum_teacher: null
  # final_momentum_teacher: null
  # warmup_teacher_temp: null
  # teacher_temp: null
  # warmup_teacher_temp_epochs: null
  in_chans: 3
distillation:
  enabled: false
  full_cfg_path: ''
  checkpoint_path: ''
multidistillation:
  enabled: false
hrft:
  enabled: false
  checkpoint_path: ''
optim:
  epochs: 30
  optimizer: adamw
  # weight_decay: null
  # weight_decay_end: null
  # lr: null
  # warmup_epochs: null
  # min_lr: null
  # schedule_trunc_extra: null
  clip_grad: 30.0
  # freeze_last_layer_epochs: null
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.98
  multi_tensor_optim: true
  dump_fsdp_weights_path: ''
  adamw_beta1: 0.9
  adamw_beta2: 0.99
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_number: 8
  local_crops_scale:
  - 0.05
  - 0.32
  global_crops_size:
  - 384 #512
  - 512
  - 512
  - 512
  - 512
  local_crops_size:
  - 112
  - 112
  - 168
  - 224
  - 336
  global_local_crop_pairs_ratios:
  - 0.3
  - 0.3
  - 0.3
  - 0.05
  - 0.05
  gram_teacher_crops_size:
  - 512
  - 768
  - 768
  - 768
  - 768
  localcrops_subset_of_globalcrops: false
  share_color_jitter: false
  horizontal_flips: false
  gram_teacher_no_distortions: true
  rgb_mean:
  - 0
  - 0
  - 0
  rgb_std:
  - 1
  - 1
  - 1
checkpointing:
  period: 250
  max_to_keep: 3
  keep_every: 50000
schedules:
  lr:
    start: 0
    peak: 0
    end: 1.25e-05
    warmup_epochs: 0
    freeze_last_layer_epochs: 5
    cosine_epochs: 10
  weight_decay:
    start: 0.04
    peak: 0.04
    end: 0.04
    warmup_epochs: 0
  teacher_temp:
    start: 0.07
    peak: 0.07
    end: 0.07
    warmup_epochs: 0
  momentum:
    start: 0.999
    peak: 0.999
    end: 0.999
    warmup_epochs: 0

# Wandb logging (custom - you'll need to integrate this)
wandb:
  enabled: true
  id: ""
  name: ${name}
  project: "ssl_mmibot_dinov3"
  resume: false
  job_type: "ssl_pretraining"

